<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Isabela ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }

        /* Mira estilo Minecraft */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            pointer-events: none;
            z-index: 5;
            transition: transform 0.2s;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 6px #ff0055;
        }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }
        #crosshair.active {
            transform: translate(-50%, -50%) scale(1.4) rotate(45deg);
        }

        /* Aviso de Interação com Quadro */
        #interact-prompt {
            position: fixed;
            top: 56%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 5, 30, 0.85);
            color: #fff;
            padding: 10px 22px;
            border-radius: 25px;
            border: 2px solid #ff3366;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            display: none;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            animation: pulsePrompt 1.5s infinite;
        }
        @keyframes pulsePrompt {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.06); }
        }

        /* Modal de Zoom da Foto */
        #photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 12, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 20px;
        }
        #photo-modal img {
            max-width: 90%;
            max-height: 70vh;
            border: 4px solid #ff3366;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.5);
            object-fit: contain;
            background: #111;
        }
        #modal-caption {
            color: #fff;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-top: 18px;
            text-align: center;
            text-shadow: 0 0 12px #ff0055;
            font-weight: bold;
        }
        #close-modal {
            margin-top: 20px;
            padding: 10px 28px;
            background: #ff0055;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        /* Tela de Pause / Início */
        #blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(25,10,35,0.85) 0%, rgba(5,2,10,0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            backdrop-filter: blur(5px);
            padding: 20px;
            transition: opacity 0.4s ease;
        }
        #instructions {
            text-align: center;
            color: #fff;
            padding: 30px 25px;
            border: 2px solid rgba(255, 51, 102, 0.4);
            border-radius: 20px;
            background: rgba(20, 5, 30, 0.75);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.3);
            cursor: pointer;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 12px;
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
        }
        p {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 20px;
        }
        .keys {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.92rem;
            color: #ff99bb;
            border: 1px solid rgba(255, 153, 187, 0.25);
            line-height: 1.7;
        }

        /* --- CONTROLES MOBILE --- */
        #mobile-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        #look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            pointer-events: auto;
        }
        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 51, 102, 0.45);
            border-radius: 50%;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            background: radial-gradient(circle, #ff6699 0%, #ff0055 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #ff0055;
            pointer-events: none;
        }
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 35px;
            width: 85px;
            height: 85px;
            background: rgba(255, 0, 85, 0.25);
            border: 2px solid rgba(255, 102, 153, 0.6);
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }
        #pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(20, 5, 30, 0.7);
            border: 1px solid rgba(255, 51, 102, 0.5);
            border-radius: 10px;
            color: #ff99bb;
            font-weight: bold;
            font-size: 0.85rem;
            pointer-events: auto;
        }

        #loading {
            position: fixed;
            bottom: 15px;
            right: 20px;
            color: #ff3366;
            font-weight: bold;
            z-index: 40;
            font-size: 0.9rem;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="interact-prompt">🔍 Ver Foto de Perto</div>

    <!-- Modal de Visualização de Foto em Tela Cheia -->
    <div id="photo-modal">
        <img id="modal-img" src="" alt="Nossa Memória">
        <div id="modal-caption"></div>
        <button id="close-modal">Voltar ao Mundo 3D ❤️</button>
    </div>

    <!-- Interface Mobile -->
    <div id="mobile-ui">
        <div id="look-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="jump-btn">PULAR</div>
        <div id="pause-btn">PAUSAR</div>
    </div>

    <!-- Menu Inicial -->
    <div id="blocker">
        <div id="instructions">
            <h1>Surpresa para Isabela ❤️</h1>
            <p>Explore nossa Galeria de Memórias e a sua Casinha Laranja com Jardim!</p>
            <div class="keys" id="controls-guide"></div>
        </div>
    </div>

    <div id="loading">Construindo galeria e casinha laranja...</div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // =========================================================================
        // DADOS DAS 11 FOTOS (Você pode editar os textos entre aspas abaixo!)
        // =========================================================================
        const photoData = [
            { id: 1,  title: "Memória #1 ❤️" },
            { id: 2,  title: "Memória #2 ✨" },
            { id: 3,  title: "Memória #3 🥰" },
            { id: 4,  title: "Memória #4 🌹" },
            { id: 5,  title: "Memória #5 💫" },
            { id: 6,  title: "Memória #6 💖" },
            { id: 7,  title: "Memória #7 😍" },
            { id: 8,  title: "Memória #8 🌟" },
            { id: 9,  title: "Memória #9 💑" },
            { id: 10, title: "Memória #10 💌" },
            { id: 11, title: "Memória #11 ♾️" }
        ];

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');
        const controlsGuide = document.getElementById('controls-guide');
        const mobileUI = document.getElementById('mobile-ui');
        const interactPrompt = document.getElementById('interact-prompt');
        const crosshair = document.getElementById('crosshair');
        const photoModal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');
        const modalCaption = document.getElementById('modal-caption');
        const closeModalBtn = document.getElementById('close-modal');

        if (isTouchDevice) {
            controlsGuide.innerHTML = `
                <b>Analógico Esquerdo:</b> Andar<br>
                <b>Arrastar Lado Direito:</b> Olhar ao redor<br>
                <b>Quadros:</b> Ver foto | <b>Ao fundo:</b> Sua Casinha Laranja 🏡
            `;
        } else {
            controlsGuide.innerHTML = `
                <b>W, A, S, D:</b> Andar | <b>SHIFT:</b> Correr<br>
                <b>ESPAÇO:</b> Pular | <b>MOUSE:</b> Olhar<br>
                <b>CLIQUE no Quadro:</b> Ampliar | <b>Ao fundo:</b> Casinha Laranja 🏡
            `;
        }

        // --- 1. CONFIGURAÇÃO DA CENA E CÂMERA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070312);
        scene.fog = new THREE.FogExp2(0x070312, 0.0045);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';
        camera.position.set(0, 6, 42);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 2. CONTROLES HÍBRIDOS ---
        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        let isGameActive = false;
        let isModalOpen = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isSprinting = false;
        let joyVec = { x: 0, y: 0 };
        let yaw = 0, pitch = 0;

        instructions.addEventListener('click', () => {
            if (isTouchDevice) {
                isGameActive = true;
                blocker.style.opacity = '0';
                setTimeout(() => { blocker.style.display = 'none'; }, 400);
                mobileUI.style.display = 'block';
            } else {
                controls.lock();
            }
        });

        controls.addEventListener('lock', () => {
            isGameActive = true;
            blocker.style.opacity = '0';
            setTimeout(() => { if(controls.isLocked) blocker.style.display = 'none'; }, 400);
        });

        controls.addEventListener('unlock', () => {
            isGameActive = false;
            if (!isModalOpen) {
                blocker.style.display = 'flex';
                setTimeout(() => blocker.style.opacity = '1', 10);
            }
        });

        document.getElementById('pause-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            isGameActive = false;
            mobileUI.style.display = 'none';
            blocker.style.display = 'flex';
            setTimeout(() => blocker.style.opacity = '1', 10);
        });

        // --- 3. GALERIA DE 11 FOTOS EM .JPEG ---
        const photoMeshes = [];
        let focusedPhoto = null;

        function createPlaceholderCanvas(index, title) {
            const c = document.createElement('canvas');
            c.width = 600; c.height = 600;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 600, 600);
            grad.addColorStop(0, '#3a0ca3');
            grad.addColorStop(1, '#f72585');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 600, 600);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 12;
            ctx.strokeRect(25, 25, 550, 550);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 48px Segoe UI, sans-serif';
            ctx.fillText(`Foto ${index}`, 300, 260);
            ctx.font = '28px Segoe UI, sans-serif';
            ctx.fillText(`images/${index}.jpeg`, 300, 320);
            ctx.fillStyle = '#ffb3c6';
            ctx.fillText(title, 300, 400);
            return c;
        }

        function createCaptionLabel(text, bgColor = '#18092c', borderColor = '#ff3366') {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 504, 120);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 38px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(c);
        }

        function loadSmartPhotoTexture(index, title, mesh, frameMesh) {
            const extensions = ['jpeg', 'JPEG', 'jpg', 'JPG', 'png'];
            let extIdx = 0;

            function tryNext() {
                if (extIdx >= extensions.length) {
                    const fallbackCanvas = createPlaceholderCanvas(index, title);
                    const tex = new THREE.CanvasTexture(fallbackCanvas);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    mesh.material.map = tex;
                    mesh.material.needsUpdate = true;
                    mesh.userData.imageSrc = fallbackCanvas.toDataURL();
                    return;
                }

                const url = `images/${index}.${extensions[extIdx]}`;
                const img = new Image();
                img.onload = () => {
                    const tex = new THREE.Texture(img);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;

                    const aspect = img.width / img.height;
                    const maxDim = 9.0;
                    let w = maxDim, h = maxDim;
                    if (aspect > 1) {
                        h = maxDim / aspect;
                    } else {
                        w = maxDim * aspect;
                    }
                    mesh.scale.set(w / 9.0, h / 9.0, 1);
                    frameMesh.scale.set(w / 9.0, h / 9.0, 1);

                    mesh.material.map = tex;
                    mesh.material.needsUpdate = true;
                    mesh.userData.imageSrc = url;
                };
                img.onerror = () => {
                    extIdx++;
                    tryNext();
                };
                img.src = url;
            }
            tryNext();
        }

        const galleryRadius = 62;
        const startAngle = -Math.PI * 0.82;
        const endAngle = Math.PI * 0.82;

        photoData.forEach((item, idx) => {
            const t = idx / (photoData.length - 1);
            const angle = startAngle + t * (endAngle - startAngle);

            const x = Math.sin(angle) * galleryRadius;
            const z = 14 + Math.cos(angle) * galleryRadius;

            const booth = new THREE.Group();
            booth.position.set(x, 0, z);
            booth.lookAt(0, 0, 14);

            const pedMat = new THREE.MeshStandardMaterial({ color: 0x241342, roughness: 0.6 });
            const pedBase = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 3), pedMat);
            pedBase.position.y = 1;
            pedBase.castShadow = true;
            pedBase.receiveShadow = true;
            booth.add(pedBase);

            const pillar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 4, 1.5), pedMat);
            pillar.position.y = 3;
            booth.add(pillar);

            const frameGeo = new THREE.BoxGeometry(9.9, 9.9, 0.6);
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0xff0055,
                emissive: 0x440018,
                roughness: 0.2,
                metalness: 0.8
            });
            const frameMesh = new THREE.Mesh(frameGeo, frameMat);
            frameMesh.position.set(0, 9.0, 0);
            frameMesh.castShadow = true;
            booth.add(frameMesh);

            const photoGeo = new THREE.PlaneGeometry(9.0, 9.0);
            const photoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const photoMesh = new THREE.Mesh(photoGeo, photoMat);
            photoMesh.position.set(0, 9.0, 0.35);
            photoMesh.userData = { id: item.id, title: item.title, frame: frameMesh, imageSrc: '' };
            booth.add(photoMesh);
            photoMeshes.push(photoMesh);

            const labelTex = createCaptionLabel(item.title);
            const labelMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(5.5, 1.35),
                new THREE.MeshBasicMaterial({ map: labelTex })
            );
            labelMesh.position.set(0, 2.7, 0.85);
            booth.add(labelMesh);

            scene.add(booth);
            loadSmartPhotoTexture(item.id, item.title, photoMesh, frameMesh);
        });

        function openPhotoModal(photoMesh) {
            if (!photoMesh) return;
            isModalOpen = true;
            isGameActive = false;
            if (!isTouchDevice && controls.isLocked) {
                controls.unlock();
            }
            modalImg.src = photoMesh.userData.imageSrc;
            modalCaption.textContent = photoMesh.userData.title;
            photoModal.style.display = 'flex';
            interactPrompt.style.display = 'none';
            if (isTouchDevice) mobileUI.style.display = 'none';
        }

        function closePhotoModal() {
            photoModal.style.display = 'none';
            isModalOpen = false;
            if (isTouchDevice) {
                isGameActive = true;
                mobileUI.style.display = 'block';
            } else {
                controls.lock();
            }
        }

        closeModalBtn.addEventListener('click', closePhotoModal);
        closeModalBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closePhotoModal(); });

        window.addEventListener('mousedown', (e) => {
            if (!isTouchDevice && isGameActive && focusedPhoto && e.button === 0) {
                openPhotoModal(focusedPhoto);
            }
        });

        interactPrompt.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (focusedPhoto) openPhotoModal(focusedPhoto);
        });
        interactPrompt.addEventListener('click', () => {
            if (focusedPhoto) openPhotoModal(focusedPhoto);
        });

        // --- 4. MULTI-TOUCH PARA CELULAR ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const lookZone = document.getElementById('look-zone');
        const jumpBtn = document.getElementById('jump-btn');

        let joyTouchId = null, lookTouchId = null;
        let lastLookX = 0, lastLookY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            updateJoystick(touch);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) updateJoystick(touch);
            }
        }, { passive: false });

        const resetJoystick = (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    joyTouchId = null;
                    joyVec.x = 0; joyVec.y = 0;
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                }
            }
        };
        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxRadius = rect.width / 2 - 20;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVec.x = dx / maxRadius;
            joyVec.y = dy / maxRadius;
        }

        lookZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lastLookX = touch.clientX;
            lastLookY = touch.clientY;
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastLookX;
                    const dy = touch.clientY - lastLookY;
                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;

                    const sensitivity = 0.0045;
                    yaw -= dx * sensitivity;
                    pitch -= dy * sensitivity;
                    const maxPitch = Math.PI / 2 - 0.1;
                    pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            }
        }, { passive: false });

        const endLook = (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        };
        lookZone.addEventListener('touchend', endLook);
        lookZone.addEventListener('touchcancel', endLook);

        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (canJump) { velocity.y += 45; canJump = false; }
        }, { passive: false });

        // --- TECLADO PARA PC ---
        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y += 45; canJump = false; } break;
                case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
            }
        });

        // --- 5. ILUMINAÇÃO E AMBIENTE ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));

        const dirLight = new THREE.DirectionalLight(0xffb3c6, 1.2);
        dirLight.position.set(30, 60, 40);
        dirLight.castShadow = true;

        // --- 6. CORAÇÕES 3D ---
        const heartShape = new THREE.Shape();

        heartShape.bezierCurveTo(-0.6, 0, -0.6, 0.7, -0.6, 0.7);

        const heartGeo = new THREE.ExtrudeGeometry(heartShape, {

        const floatingHearts = [];

        for (let i = 0; i < 110; i++) {

        // =========================================================================
        // 7. A CASINHA LARANJA DOS SONHOS DA ISABELA + JARDIM DE PLANTINHAS
        // =========================================================================
        const gardenFlowers = [];
        const chimneyHearts = [];

        function buildOrangeHouseAndGarden() {
            const houseGroup = new THREE.Group();

            // 2. Paredes Laranjas da Casinha (Tom Laranja Aconchegante e Vibrante)
            const orangeWallMat = new THREE.MeshStandardMaterial({ color: 0xff7b29, roughness: 0.55 });

            for (let i = 0; i < 6; i++) {

            // 5. Porta da Frente, Degrau e Placa "Nosso Lar ❤️"
            const porchStep = new THREE.Mesh(new THREE.BoxGeometry(7, 0.6, 3.5), pathStoneMat);
            porchStep.position.set(0, 0.5, 6.5);
            houseGroup.add(porchStep);

            const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(4.8, 8.6, 0.5), whiteTrimMat);
            doorFrame.position.set(0, 4.5, 5.05);

            const door = new THREE.Mesh(new THREE.BoxGeometry(4.0, 8.0, 0.65), darkWoodMat);

            // Plaquinha acolhedora sobre a porta
            const homeLabelTex = createCaptionLabel("Casinha da Isabela 🧡", "#3d1605", "#ff9933");
            const homeSign = new THREE.Mesh(
                new THREE.PlaneGeometry(6.5, 1.6),

            );
            homeSign.position.set(0, 10.3, 5.2);
            houseGroup.add(homeSign);

            // 6. Janelas Iluminadas (Luz quentinha saindo de dentro da casa)
            const warmGlassMat = new THREE.MeshBasicMaterial({ color: 0xffe49e });

            function createWindow(wx, wy, wz, rotY = 0) {
                const winGroup = new THREE.Group();
                winGroup.position.set(wx, wy, wz);
                winGroup.rotation.y = rotY;

                const frame = new THREE.Mesh(new THREE.BoxGeometry(4.4, 4.4, 0.4), whiteTrimMat);
                const glass = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 3.7), warmGlassMat);
                glass.position.z = 0.24;

                const barV = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4.0, 0.5), whiteTrimMat);

                // Floreira de madeira na base da janela
                const windowBox = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.0, 1.3), darkWoodMat);
                windowBox.position.set(0, -2.4, 0.5);

            // Janelas frontais e laterais
            createWindow(-7.2, 7.0, 5.05, 0);
            createWindow(7.2, 7.0, 5.05, 0);
            createWindow(-12.05, 7.0, -4, -Math.PI / 2);
            createWindow(12.05, 7.0, -4, Math.PI / 2);

            // Luz aconchegante na varanda da casinha
            const porchLight = new THREE.PointLight(0xffaa44, 5, 65);
            porchLight.position.set(0, 11.5, 9);
            houseGroup.add(porchLight);

            // 7. Cerquinha Branca ao redor do Jardim
            const fencePostGeo = new THREE.BoxGeometry(0.5, 3.2, 0.5);
            for (let x = -27; x <= 27; x += 2.5) {
                // Deixa abertura no portãozinho central
                if (Math.abs(x) > 3.5) {
                    const postFront = new THREE.Mesh(fencePostGeo, whiteTrimMat);
                    postFront.position.set(x, 1.6, 25);
                    houseGroup.add(postFront);
                }
                const postBack = new THREE.Mesh(fencePostGeo, whiteTrimMat);
                postBack.position.set(x, 1.6, -17);
                houseGroup.add(postBack);
            }
            for (let z = -17; z <= 25; z += 2.5) {
                const postLeft = new THREE.Mesh(fencePostGeo, whiteTrimMat);
                postLeft.position.set(-27, 1.6, z);
                const postRight = new THREE.Mesh(fencePostGeo, whiteTrimMat);
                postRight.position.set(27, 1.6, z);
                houseGroup.add(postLeft, postRight);
            }

            // Travessas horizontais da cerca frontal
            const railLeft = new THREE.Mesh(new THREE.BoxGeometry(23.5, 0.35, 0.25), whiteTrimMat);
            railLeft.position.set(-15.2, 2.2, 25);
            const railRight = new THREE.Mesh(new THREE.BoxGeometry(23.5, 0.35, 0.25), whiteTrimMat);
            railRight.position.set(15.2, 2.2, 25);
            houseGroup.add(railLeft, railRight);

            // 8. VÁRIAS PLANTINHAS, FLORES, CANTEIROS, VASINHOS E ÁRVORES!
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x38b000, roughness: 0.6 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2b9348, roughness: 0.7 });
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.95 });
            const potMat = new THREE.MeshStandardMaterial({ color: 0xc85a32, roughness: 0.6 });
            const flowerPalette = [0xff4d6d, 0xffbe0b, 0xff007f, 0xc77dff, 0x00f5d4, 0xff758f, 0xffffff];

            function spawnFlower(fx, fy, fz, scale = 1) {
                const flower = new THREE.Group();
                flower.position.set(fx, fy, fz);

                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 6), stemMat);
                stem.position.y = 0.7;
                flower.add(stem);

                // Folhinhas no caule
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.1, 0.2), leafMat);
                leaf.position.set(0.2, 0.5, 0);
                leaf.rotation.z = 0.4;
                flower.add(leaf);

                // Pétalas coloridas e miolo
                const color = flowerPalette[Math.floor(Math.random() * flowerPalette.length)];
                const blossom = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(0.42),
                    new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.25, roughness: 0.3 })
                );
                blossom.position.y = 1.45;
                flower.add(blossom);

                const center = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xffee32 })
                );
                center.position.y = 1.65;
                flower.add(center);

                flower.scale.set(scale, scale, scale);
                houseGroup.add(flower);

                gardenFlowers.push({
                    group: flower,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.002 + Math.random() * 0.002
                });
            }

            // Canteiros de terra na frente da casinha cheios de flores
            [-11.5, 11.5].forEach(bx => {
                const bed = new THREE.Mesh(new THREE.BoxGeometry(12, 0.5, 6), soilMat);
                bed.position.set(bx, 0.5, 10);
                houseGroup.add(bed);

                for (let i = 0; i < 24; i++) {
                    const fx = bx + (Math.random() - 0.5) * 10.5;
                    const fz = 10 + (Math.random() - 0.5) * 5.0;
                    spawnFlower(fx, 0.7, fz, 0.85 + Math.random() * 0.5);
                }
            });

            // Flores nas floreiras das janelas
            [-7.2, 7.2].forEach(wx => {
                for (let dx = -1.6; dx <= 1.6; dx += 0.8) {
                    spawnFlower(wx + dx, 4.9, 5.55, 0.65);
                }
            });

            // Flores e arbustos espalhados por todo o gramado do jardim
            for (let i = 0; i < 65; i++) {
                const rx = (Math.random() - 0.5) * 50;
                const rz = 7 + Math.random() * 16;
                // Não planta em cima das pedras do caminho central
                if (Math.abs(rx) > 3.8) {
                    spawnFlower(rx, 0.35, rz, 0.7 + Math.random() * 0.7);
                }
            }

            // Arbustos redondinhos verdes com florzinhas pelo jardim
            const bushCoords = [
                [-22, 21], [22, 21], [-23, 12], [23, 12],
                [-17, 18], [17, 18], [-6, 22], [6, 22]
            ];
            bushCoords.forEach(([bx, bz]) => {
                const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(1.7, 1), leafMat);
                bush.position.set(bx, 1.4, bz);
                bush.castShadow = true;
                houseGroup.add(bush);
            });

            // Vasinhos de plantas na entrada da varanda e no portãozinho
            [[-4.4, 6.8], [4.4, 6.8], [-4.8, 24.5], [4.8, 24.5]].forEach(([px, pz]) => {
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.65, 1.4, 12), potMat);
                pot.position.set(px, 1.0, pz);
                houseGroup.add(pot);

                const fern = new THREE.Mesh(new THREE.DodecahedronGeometry(1.05, 1), stemMat);
                fern.position.set(px, 2.0, pz);
                houseGroup.add(fern);

                spawnFlower(px, 2.1, pz, 0.85);
            });

            // Duas árvores frondosas nas laterais da casinha laranja
            function createGardenTree(tx, tz) {
                const tree = new THREE.Group();
                tree.position.set(tx, 0, tz);

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.3, 9, 8), darkWoodMat);
                trunk.position.y = 4.5;

                    const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), crownMat);

                houseGroup.add(tree);
            }

            createGardenTree(-20, -4);

            scene.add(houseGroup);
        }

        buildOrangeHouseAndGarden();

        // --- 8. TEXTO CENTRAL 3D ---
        let textMesh;
        const fontLoader = new FontLoader();
        fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
            const textGeo = new TextGeometry('Eu te amo, Isabela!', {
                font: font,

                height: 0.9,
                curveSegments: 10,
                bevelEnabled: true,

                bevelSize: 0.08,

            });
            textGeo.center();

            const textMaterials = [
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.8 }),
                new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x880022, roughness: 0.3 })
            ];

            textMesh = new THREE.Mesh(textGeo, textMaterials);
            textMesh.position.set(0, 8, 0);
            textMesh.castShadow = true;
            scene.add(textMesh);

            document.getElementById('loading').style.display = 'none';
        });

        // Céu Estrelado
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2200;
        const posArray = new Float32Array(starsCount * 3);
        const colorsArray = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 420;
            posArray[i+1] = 2 + Math.random() * 150;
            posArray[i+2] = (Math.random() - 0.5) * 420;
            colorsArray[i] = 0.8 + Math.random() * 0.2;
            colorsArray[i+1] = 0.5 + Math.random() * 0.5;
            colorsArray[i+2] = 0.8 + Math.random() * 0.2;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const starMesh = new THREE.Points(
            starsGeo,
            new THREE.PointsMaterial({ size: 0.55, vertexColors: true, transparent: true, opacity: 0.8 })
        );
        scene.add(starMesh);

        // --- 9. RAYCASTER (Detecta qual das 11 fotos a Isabela está olhando) ---
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0);

        function checkPhotoFocus() {
            if (!isGameActive) return;

            raycaster.setFromCamera(screenCenter, camera);
            const intersects = raycaster.intersectObjects(photoMeshes);

            photoMeshes.forEach(p => p.userData.frame.material.emissive.setHex(0x440018));

            if (intersects.length > 0 && intersects[0].distance < 35) {
                focusedPhoto = intersects[0].object;
                focusedPhoto.userData.frame.material.emissive.setHex(0xff0066);
                crosshair.classList.add('active');
                interactPrompt.style.display = 'block';
                interactPrompt.textContent = isTouchDevice
                    ? `🔍 Toque aqui: ${focusedPhoto.userData.title}`
                    : `🔍 Clique para ampliar: ${focusedPhoto.userData.title}`;
            } else {
                focusedPhoto = null;
                crosshair.classList.remove('active');
                interactPrompt.style.display = 'none';
            }
        }

        // --- 10. LOOP DE FÍSICA E ANIMAÇÃO ---
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerHeight = 6.0;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (isGameActive) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 12.0 * delta;

                const speed = isSprinting ? 220.0 : 135.0;

                if (isTouchDevice) {
                    velocity.z -= joyVec.y * speed * 1.2 * delta;
                    velocity.x -= joyVec.x * speed * 1.2 * delta;
                } else {
                    direction.z = Number(moveForward) - Number(moveBackward);
                    direction.x = Number(moveRight) - Number(moveLeft);
                    direction.normalize();

                    if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                    if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < playerHeight) {
                    velocity.y = 0;
                    controls.getObject().position.y = playerHeight;
                    canJump = true;
                }

                checkPhotoFocus();
            }

            prevTime = time;

            if (textMesh) {
                textMesh.position.y = 8 + Math.sin(time * 0.002) * 0.6;
                textMesh.rotation.y = Math.sin(time * 0.0008) * 0.12;
            }

            if (bigHeart) {
                bigHeart.rotation.y += 0.015;
                const pulse = 3.5 + Math.sin(time * 0.008) * 0.3;
                bigHeart.scale.set(pulse, pulse, pulse);
            }

            floatingHearts.forEach(h => {
                h.mesh.rotation.y += h.rotSpeed;
                h.mesh.position.y = h.baseY + Math.sin(time * h.floatSpeed + h.floatOffset) * 1.5;
            });

            // Plantinhas do jardim balançando suavemente com o vento
            gardenFlowers.forEach(f => {
                f.group.rotation.z = Math.sin(time * f.speed + f.phase) * 0.08;
            });

            // Corações subindo pela chaminé da casinha laranja
            chimneyHearts.forEach(ch => {
                const cycle = ((time * 0.002 + ch.offset) % 6) / 6;
                ch.mesh.position.y = 21 + cycle * 14;
                ch.mesh.rotation.y += 0.02;
                ch.mesh.material.opacity = 1 - cycle;
            });

            starMesh.rotation.y = time * 0.00005;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
